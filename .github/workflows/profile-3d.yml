name: Generate 3D Profile Calendar

# 每天生成 3D 贡献日历（自托管 SVG，不依赖第三方服务）
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yuno/github-profile-3d-contrib@latest
        with:
          username: ${{ github.repository_owner }}
          output: profile-3d-contrib/profile-night-view.svg
          max_contributions: 2

      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/*.svg
          git commit -m "Generate 3D contribution calendar" || exit 0
          git push
